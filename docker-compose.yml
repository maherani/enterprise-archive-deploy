# ==============================================================================
# Enterprise Archive System - Master Orchestrator (Umbrella Deployment v2.0)
# Orchestrates 7 Containers across Archive Core, AI Box Gateway & Messaging
# ==============================================================================

name: enterprise-archive-deploy

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database (Archive Core)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: archive_db
    restart: unless-stopped
    volumes:
      - archive_db_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-nextcloud}
      - POSTGRES_USER=${POSTGRES_USER:-nextcloud_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - archive_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-nextcloud_user} -d $${POSTGRES_DB:-nextcloud}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Nextcloud Application Server (Archive Core)
  # ----------------------------------------------------------------------------
  app:
    image: nextcloud:apache
    container_name: archive_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - nextcloud_html:/var/www/html
      - ./archive_core/apps/archive_autotag:/var/www/html/custom_apps/archive_autotag:ro
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB:-nextcloud}
      - POSTGRES_USER=${POSTGRES_USER:-nextcloud_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER:-admin}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_TRUSTED_DOMAINS:-localhost 127.0.0.1 docs.maskan}
    networks:
      - archive_net

  # ----------------------------------------------------------------------------
  # 3. Reverse Proxy (Archive Core)
  # ----------------------------------------------------------------------------
  proxy:
    image: nginx:alpine
    container_name: archive_proxy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./archive_core/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./archive_core/nginx/maintenance.html:/usr/share/nginx/html/maintenance.html:ro
    networks:
      - archive_net
      - ai_chat_net

  # ----------------------------------------------------------------------------
  # 4. Ollama Local LLM & Embedding Engine (AI Box)
  # ----------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:0.5.4
    container_name: ai_box_ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - ai_box_net
    expose:
      - "11434"

  # ----------------------------------------------------------------------------
  # 5. AnythingLLM Vector & RAG Core (AI Box)
  # ----------------------------------------------------------------------------
  anythingllm:
    image: mintplexlabs/anythingllm@sha256:73db67cfac27814325f5d482faa34404498eb360a92bbb5461d4c44cdf87716d
    container_name: ai_box_anythingllm
    restart: unless-stopped
    environment:
      - STORAGE_DIR=/app/server/storage
      - SERVER_PORT=3001
      - DISABLE_TELEMETRY=true
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_PATH=http://ollama:11434
      - OLLAMA_MODEL_PREF=${EMBEDDING_MODEL_PREF:-qwen2.5:0.5b-instruct}
      - EMBEDDING_ENGINE=ollama
      - EMBEDDING_BASE_PATH=http://ollama:11434
      - EMBEDDING_MODEL_PREF=${EMBEDDING_MODEL_PREF:-qwen2.5:0.5b-instruct}
      - VECTOR_DB=${VECTOR_DB:-lancedb}
    volumes:
      - ./ai_box_gateway/data/anythingllm:/app/server/storage
    networks:
      - ai_box_net
    expose:
      - "3001"
    depends_on:
      - ollama

  # ----------------------------------------------------------------------------
  # 6. AI Box Security & Session ACL Gateway (AI Box)
  # ----------------------------------------------------------------------------
  gateway:
    build:
      context: ./ai_box_gateway/gateway
      dockerfile: Dockerfile
    image: ai_box_gateway:1.0
    container_name: ai_box_gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-3001}:3001"
    environment:
      - BACKEND_HOST=${BACKEND_HOST:-anythingllm}
      - BACKEND_PORT=${BACKEND_PORT:-3001}
      - GATEWAY_PORT=${GATEWAY_PORT:-3001}
      - MAX_FILE_SIZE_BYTES=${MAX_FILE_SIZE_BYTES:-2097152}
      - ARCHIVE_OCS_URL=http://archive_proxy:80
      - ARCHIVE_HOST_HEADER=localhost
      - GID_MAP_PATH=/app/data/gid_workspace_map.json
      - DESTINATION_API_KEY=${DESTINATION_API_KEY:-ai_box_internal_api_secret_key}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:-ai_box_internal_api_secret_key}
      - SESSION_ACL_CACHE_TTL=${SESSION_ACL_CACHE_TTL:-3600}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://127.0.0.1,http://127.0.0.1:80,http://docs.maskan,http://docs.maskan:80}
    volumes:
      - ./ai_box_gateway/data:/app/data
    networks:
      - ai_box_net
      - ai_chat_net
    depends_on:
      - anythingllm

  # ----------------------------------------------------------------------------
  # 7. RabbitMQ Event Broker (AI Box & Integration Layer)
  # ----------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-alpine
    container_name: ai_box_rabbitmq
    restart: unless-stopped
    hostname: ai_box_rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-guest}
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_DEFAULT_VHOST:-/}
    volumes:
      - ./ai_box_gateway/data/rabbitmq:/var/lib/rabbitmq
      - ./ai_box_gateway/config/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - ai_box_net
      - ai_chat_net
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  archive_net:
    driver: bridge
  ai_box_net:
    driver: bridge
  ai_chat_net:
    name: ai_chat_net
    driver: bridge

volumes:
  archive_db_data:
  nextcloud_html:
  ollama_models:
